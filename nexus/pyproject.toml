[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "nexus"
version = "0.1.0"
description = "Knowledge base with Graph RAG — Neo4j backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "neo4j",
    "python-dotenv",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "markdownify",
    "pyyaml",
]
