<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      font-weight: bold;
    }

    .user-badge {
      font-size: 11px;
      color: #8b5cf6;
      background: #1a1625;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
    }

    .user-badge:hover { background: #251d35; }

    /* --- Auth views --- */

    .auth-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-view h2 {
      font-size: 18px;
      color: #fff;
      text-align: center;
      margin-bottom: 4px;
    }

    .auth-view p {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 8px;
    }

    /* --- Shared form styles --- */

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }

    .field input:focus, .field select:focus {
      border-color: #6366f1;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      font-size: 12px;
      padding: 8px;
    }

    .btn-secondary:hover { border-color: #555; color: #ccc; }

    .btn-danger {
      background: transparent;
      border: 1px solid #333;
      color: #ef4444;
      font-size: 12px;
      padding: 6px;
    }

    .btn-danger:hover { background: #1a0a0a; }

    .link-btn {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
    }

    .link-btn:hover { text-decoration: underline; }

    /* --- Article preview --- */

    .preview {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .preview-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .preview-meta {
      font-size: 11px;
      color: #888;
    }

    .preview-excerpt {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      line-height: 1.4;
      max-height: 60px;
      overflow: hidden;
    }

    .saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #0a2015;
      color: #10b981;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 8px;
    }

    /* --- Settings --- */

    .settings {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .toggle-row label {
      font-size: 12px;
      color: #ccc;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider { background: #6366f1; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    .settings-toggle {
      font-size: 11px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 8px;
    }

    .settings-toggle:hover { color: #999; }

    .settings-panel { display: none; }
    .settings-panel.open { display: block; }

    /* --- Status --- */

    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    .status.saving { color: #f59e0b; }
    .status.success { color: #10b981; }
    .status.error { color: #ef4444; }

    .extracting {
      text-align: center;
      padding: 40px 0;
      color: #888;
      font-size: 13px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .divider {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">K</div>
      <h1>Kuro Clipper</h1>
    </div>
    <span class="user-badge" id="userBadge" style="display:none;" title="Click to logout"></span>
  </div>

  <!-- LOGIN VIEW -->
  <div class="view" id="loginView">
    <div class="auth-view">
      <h2>Sign In</h2>
      <p>Log in to save articles to your Kuro wiki</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <div class="divider">or</div>
      <button class="link-btn" id="showSignup">Create an account</button>
      <div class="status" id="loginStatus"></div>
    </div>
  </div>

  <!-- SIGNUP VIEW -->
  <div class="view" id="signupView">
    <div class="auth-view">
      <h2>Create Account</h2>
      <p>Sign up to start saving articles</p>
      <div class="field">
        <label>Username (your user ID)</label>
        <input type="text" id="signupUsername" placeholder="e.g. div">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters">
      </div>
      <button class="btn btn-primary" id="signupBtn">Create Account</button>
      <div class="divider">or</div>
      <button class="link-btn" id="showLogin">Already have an account</button>
      <div class="status" id="signupStatus"></div>
    </div>
  </div>

  <!-- LOADING VIEW -->
  <div class="view" id="loadingView">
    <div class="extracting">Extracting article...</div>
  </div>

  <!-- MAIN VIEW (logged in + article extracted) -->
  <div class="view" id="mainView">
    <div class="preview">
      <div class="preview-title" id="title"></div>
      <div class="preview-meta" id="meta"></div>
      <div class="preview-excerpt" id="excerpt"></div>
      <div class="saved-badge" id="savedBadge" style="display:none;">Already saved</div>
    </div>

    <button class="settings-toggle" id="settingsToggle">Settings</button>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings">
        <div class="field">
          <label>API URL</label>
          <input type="text" id="apiUrl" placeholder="http://localhost:8000">
        </div>
        <div class="field">
          <label>Topic</label>
          <select id="topic">
            <option value="general">General</option>
            <option value="tech">Tech</option>
            <option value="science">Science</option>
            <option value="business">Business</option>
            <option value="design">Design</option>
            <option value="ai">AI</option>
          </select>
        </div>
        <div class="toggle-row">
          <label>Auto-extract concepts</label>
          <div class="toggle">
            <input type="checkbox" id="autoExtract">
            <span class="slider"></span>
          </div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn">Save to Kuro</button>
    <div class="status" id="status"></div>
  </div>

  <!-- ERROR VIEW -->
  <div class="view" id="errorView">
    <div class="preview" style="border-color:#ef4444;">
      <div class="preview-title" style="color:#ef4444;">Could not extract article</div>
      <div class="preview-excerpt" id="errorMsg"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
